<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acts of the Apostles — Geographic Explorer</title>
  <meta name="description" content="Interactive map, timeline, and gazetteer of every place in the book of Acts, with Paul's missionary journeys and the voyage to Rome.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
        integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19c6 0 3.5-11 9-12" stroke-dasharray="0.1 3.4"/>
          <circle cx="4" cy="19" r="1.7" fill="currentColor" stroke="none"/>
          <path d="M17.5 3.5A3.6 3.6 0 0 1 21 7.1c0 2.7-3.5 6.4-3.5 6.4S14 9.8 14 7.1a3.6 3.6 0 0 1 3.5-3.6Z"/>
          <circle cx="17.5" cy="7" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h1><span class="brand-name">Acts of the Apostles</span> <span class="visually-hidden">—</span> <span class="brand-sub">Geographic Explorer</span></h1>
    </div>
    <div id="journey-toggles" aria-label="Journey visibility toggles"></div>
  </header>
  <main id="map" aria-label="Map of Acts places and journeys"></main>
  <aside id="callout" aria-live="polite"></aside>
  <section id="timeline" aria-label="Timeline of Acts chapters by year"></section>
  <footer id="footer">
    <span>Base map: <a href="https://www.imperium.ahlfeldt.se/">DARE</a> (CC BY 4.0)</span>
    <span>Place data: <a href="https://www.openbible.info/geo/">OpenBible.info</a> (CC BY)</span>
    <span>Chronology &amp; descriptions: <a href="https://github.com/robertrouse/theographic-bible-metadata">Theographic</a> / Easton's (CC BY-SA)</span>
    <span>Code: MIT · Derived data: CC BY-SA</span>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
          integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
